<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گپ بتمنی | Gap Batman</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
        * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0b141a; }
        ::-webkit-scrollbar-thumb { background: #202c33; border-radius: 4px; }
        .bg-telegram-sidebar { background-color: #111b21; }
        .bg-telegram-chat { background-color: #0b141a; }
        .bg-telegram-header { background-color: #202c33; }
        .chat-bg { background-color: #0b141a; background-image: radial-gradient(#1f2c34 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body class="bg-[#0b141a] text-gray-100 h-screen overflow-hidden flex flex-col">

    <!-- Splash Screen / لودینگ اولیه -->
    <div id="splash-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="relative mb-6 animate-pulse">
            <!-- آرم بتمن -->
            <svg class="w-32 h-32 text-black drop-shadow-2xl" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C9.5 2 7.8 3.3 6.5 4.8C5 6.5 3.5 9 3.5 12C3.5 13.5 4 15 5 16.5C5.8 17.8 7 19 8.5 19.5C7.8 18.5 7.5 17 7.5 15.5C7.5 13 9.5 11 12 11C14.5 11 16.5 13 16.5 15.5C16.5 17 16.2 18.5 15.5 19.5C17 19 18.2 17.8 19 16.5C20 15 20.5 13.5 20.5 12C20.5 9 19 6.5 17.5 4.8C16.2 3.3 14.5 2 12 2Z"/>
            </svg>
        </div>
        <div class="w-48 h-1.5 bg-gray-200 rounded-full overflow-hidden">
            <div id="loading-bar" class="h-full bg-black transition-all duration-500 w-0"></div>
        </div>
        <span class="text-gray-500 text-xs mt-3 font-medium tracking-widest">GAP BATMAN SECURE CHAT</span>
    </div>

    <!-- Login Modal / صفحه ورود کاربر و مالک -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-[#111b21] border border-gray-800 p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-black/40 border border-yellow-500/40 rounded-full flex items-center justify-center mx-auto mb-3 text-yellow-500 text-2xl">
                    <i class="fa-solid fa-bat"></i>
                </div>
                <h2 class="text-xl font-bold text-white">ورود به گپ بتمنی</h2>
                <p class="text-xs text-gray-400 mt-1">نام خود را وارد کنید یا با رمز مالک وارد شوید</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">نام نمایشی شما</label>
                    <input type="text" id="username-input" placeholder="مثلا: علی یا batman..." class="w-full bg-[#202c33] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">رمز ورود مالک (اختیاری)</label>
                    <input type="password" id="owner-pass-input" placeholder="رمز عبور مالک..." class="w-full bg-[#202c33] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-yellow-500">
                </div>
                <button onclick="handleLogin()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-2.5 rounded-xl transition duration-200 shadow-lg text-sm">
                    ورود به پیام‌رسان
                </button>
            </div>
        </div>
    </div>

    <!-- Main Messenger App / بدنه اصلی پیام‌رسان -->
    <div id="app-container" class="flex flex-1 overflow-hidden hidden">
        
        <!-- Sidebar Navigation (Telegram Style Categories) -->
        <div class="w-16 bg-telegram-sidebar border-l border-[#202c33] flex flex-col items-center py-3 justify-between z-10">
            <div class="flex flex-col space-y-4">
                <div class="w-10 h-10 rounded-full bg-black border border-yellow-500/50 flex items-center justify-center text-yellow-500 shadow-md cursor-pointer">
                    <i class="fa-solid fa-bat"></i>
                </div>
                <div class="w-10 h-10 rounded-xl bg-[#202c33] hover:bg-[#2a3942] flex items-center justify-center text-yellow-400 cursor-pointer relative group transition" title="گپ بتمنی">
                    <i class="fa-solid fa-comments text-lg"></i>
                    <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-[#111b21]"></span>
                </div>
                <div class="w-10 h-10 rounded-xl hover:bg-[#2a3942] flex items-center justify-center text-gray-400 cursor-pointer transition" title="گروه‌ها (قفل)">
                    <i class="fa-solid fa-users text-sm opacity-50"></i>
                </div>
                <div class="w-10 h-10 rounded-xl hover:bg-[#2a3942] flex items-center justify-center text-gray-400 cursor-pointer transition" title="کانال‌ها (قفل)">
                    <i class="fa-solid fa-bullhorn text-sm opacity-50"></i>
                </div>
            </div>
            <div class="flex flex-col space-y-3">
                <div class="w-10 h-10 rounded-xl hover:bg-[#2a3942] flex items-center justify-center text-gray-400 cursor-pointer transition" title="تنظیمات">
                    <i class="fa-solid fa-gear text-sm"></i>
                </div>
            </div>
        </div>

        <!-- Chat List Panel (Left Side of Chat) -->
        <div class="w-80 bg-telegram-sidebar border-l border-[#202c33] hidden md:flex flex-col">
            <div class="p-3 border-b border-[#202c33] flex items-center justify-between">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div id="user-avatar" class="w-10 h-10 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-sm">U</div>
                    <div>
                        <div id="sidebar-username" class="text-sm font-bold text-white flex items-center gap-1">کاربر</div>
                        <div class="text-[11px] text-green-400">آنلاین</div>
                    </div>
                </div>
            </div>
            <div class="p-2">
                <div class="bg-[#202c33] rounded-lg px-3 py-1.5 flex items-center">
                    <i class="fa-solid fa-search text-gray-400 text-xs ml-2"></i>
                    <input type="text" placeholder="جستجو..." class="bg-transparent text-xs text-white focus:outline-none w-full">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto mt-1">
                <!-- Chat Item: Gap Batman -->
                <div class="flex items-center px-3 py-2.5 bg-[#202c33]/60 cursor-pointer border-r-4 border-yellow-500">
                    <div class="w-12 h-12 rounded-full bg-black border border-yellow-500/40 flex items-center justify-center text-yellow-500 text-lg shrink-0 ml-3">
                        <i class="fa-solid fa-bat"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="text-sm font-bold text-white truncate flex items-center gap-1">
                                گپ بتمنی
                                <span class="bg-blue-500 text-white rounded-full inline-flex items-center justify-center w-3.5 h-3.5 text-[8px]" title="تیک رسمی"><i class="fa-solid fa-check"></i></span>
                            </span>
                            <span class="text-[10px] text-green-400">هم اکنون</span>
                        </div>
                        <p class="text-xs text-gray-400 truncate">گپ عمومی رسمی بتمن - گفتگو آزاد</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col bg-telegram-chat chat-bg">
            <!-- Chat Header -->
            <div class="h-14 bg-telegram-header px-4 flex items-center justify-between border-b border-[#202c33] z-10">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-10 h-10 rounded-full bg-black border border-yellow-500/40 flex items-center justify-center text-yellow-500 text-base">
                        <i class="fa-solid fa-bat"></i>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-white flex items-center gap-1.5">
                            گپ بتمنی
                            <span class="bg-blue-500 text-white rounded-full inline-flex items-center justify-center w-4 h-4 text-[9px]" title="تیک رسمی"><i class="fa-solid fa-check"></i></span>
                        </div>
                        <div class="text-[11px] text-gray-400">اعضای آنلاین در گروه</div>
                    </div>
                </div>
                <div class="flex items-center space-x-4 space-x-reverse text-gray-300">
                    <button class="hover:text-yellow-400 transition"><i class="fa-solid fa-search"></i></button>
                    <button class="hover:text-yellow-400 transition"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- پیام خوش‌آمدگویی پیش‌فرض -->
                <div class="flex justify-center my-2">
                    <div class="bg-[#182229] text-gray-300 text-[11px] px-3 py-1.5 rounded-xl shadow-md border border-gray-800">
                        به گپ بتمنی خوش آمدید! ارسال متن، تصویر و ویس آزاد است.
                    </div>
                </div>
            </div>

            <!-- Chat Input Footer -->
            <div class="p-3 bg-telegram-header border-t border-[#202c33] flex items-center gap-2">
                <button onclick="document.getElementById('image-input').click()" class="text-gray-400 hover:text-yellow-400 p-2 transition" title="ارسال عکس">
                    <i class="fa-solid fa-image text-lg"></i>
                </button>
                <input type="file" id="image-input" accept="image/*" class="hidden" onchange="sendImage(event)">

                <button onclick="sendVoiceMessage()" class="text-gray-400 hover:text-yellow-400 p-2 transition" title="ارسال ویس (شبیه‌ساز)">
                    <i class="fa-solid fa-microphone text-lg"></i>
                </button>

                <input type="text" id="message-input" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter') sendMessage()" class="flex-1 bg-[#2a3942] text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none border border-transparent focus:border-yellow-500">

                <button onclick="sendMessage()" class="bg-yellow-500 hover:bg-yellow-400 text-black w-10 h-10 rounded-xl flex items-center justify-center transition shadow-md shrink-0">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = { name: '', isOwner: false };

        // شبیه‌سازی لودینگ اولیه
        window.addEventListener('load', () => {
            const bar = document.getElementById('loading-bar');
            bar.style.width = '100%';
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    checkLogin();
                }, 700);
            }, 1000);
        });

        function checkLogin() {
            const savedName = localStorage.getItem('batman_chat_name');
            const savedOwner = localStorage.getItem('batman_chat_isOwner') === 'true';

            if (savedName) {
                currentUser.name = savedName;
                currentUser.isOwner = savedOwner;
                initApp();
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
            }
        }

        function handleLogin() {
            const nameInput = document.getElementById('username-input').value.trim();
            const passInput = document.getElementById('owner-pass-input').value.trim();

            let isOwner = false;
            let finalName = nameInput || 'کاربر مهمان';

            if (passInput === 'batman1792') {
                isOwner = true;
                finalName = 'batman';
            } else if (!nameInput) {
                alert('لطفا نام خود را وارد کنید.');
                return;
            }

            currentUser.name = finalName;
            currentUser.isOwner = isOwner;

            localStorage.setItem('batman_chat_name', finalName);
            localStorage.setItem('batman_chat_isOwner', isOwner);

            document.getElementById('login-modal').classList.add('hidden');
            initApp();
        }

        function initApp() {
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('sidebar-username').innerHTML = `
                ${currentUser.name} 
                ${currentUser.isOwner ? '<span class="bg-blue-500 text-white rounded-full inline-flex items-center justify-center w-3 h-3 text-[7px]"><i class="fa-solid fa-check"></i></span>' : ''}
            `;
            document.getElementById('user-avatar').innerText = currentUser.name.charAt(0).toUpperCase();
        }

        // دریافت تاریخچه و پیام‌ها از سرور
        socket.on('init_data', (data) => {
            const container = document.getElementById('chat-messages');
            // پاک کردن پیام‌های اضافی و نگه داشتن پیام خوش‌آمدگویی
            while (container.children.length > 1) {
                container.removeChild(container.lastChild);
            }
            data.messages.forEach(msg => appendMessage(msg));
        });

        socket.on('new_message', (msg) => {
            appendMessage(msg);
        });

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            socket.emit('send_message', {
                name: currentUser.name,
                isOwner: currentUser.isOwner,
                text: text,
                type: 'text'
            });

            input.value = '';
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('send_message', {
                    name: currentUser.name,
                    isOwner: currentUser.isOwner,
                    type: 'image',
                    mediaUrl: e.target.result
                });
            };
            reader.readAsDataURL(file);
        }

        function sendVoiceMessage() {
            socket.emit('send_message', {
                name: currentUser.name,
                isOwner: currentUser.isOwner,
                type: 'voice',
                text: '🎙️ پیام صوتی (ویس)'
            });
        }

        function appendMessage(msg) {
            const container = document.getElementById('chat-messages');
            const isMe = msg.name === currentUser.name;
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2`;

            let contentHTML = '';
            if (msg.type === 'image') {
                contentHTML = `<img src="${msg.mediaUrl}" class="rounded-xl max-w-[220px] max-h-[220px] object-cover mb-1 border border-gray-700">`;
            } else if (msg.type === 'voice') {
                contentHTML = `
                    <div class="flex items-center gap-3 py-1">
                        <button class="w-8 h-8 rounded-full bg-yellow-500 text-black flex items-center justify-center"><i class="fa-solid fa-play text-xs"></i></button>
                        <div class="w-32 h-1.5 bg-gray-600 rounded-full overflow-hidden"><div class="w-2/3 h-full bg-yellow-500"></div></div>
                        <span class="text-[10px] text-gray-300">0:07</span>
                    </div>
                `;
            } else {
                contentHTML = `<p class="text-sm text-white break-words">${escapeHtml(msg.text)}</p>`;
            }

            div.innerHTML = `
                <div class="max-w-[75%] md:max-w-[60%] rounded-2xl px-4 py-2 shadow-md ${isMe ? 'bg-[#005c4b] rounded-tr-none' : 'bg-[#202c33] rounded-tl-none'}">
                    <div class="text-[11px] font-bold mb-1 flex items-center gap-1 ${msg.isOwner ? 'text-yellow-400' : 'text-blue-400'}">
                        ${escapeHtml(msg.name)}
                        ${msg.isOwner ? '<span class="bg-blue-500 text-white rounded-full inline-flex items-center justify-center w-3 h-3 text-[7px]"><i class="fa-solid fa-check"></i></span>' : ''}
                    </div>
                    ${contentHTML}
                    <div class="text-[9px] text-gray-400 text-left mt-1">${msg.time}</div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>

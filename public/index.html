<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>گپ بتمنی | Gap Batman</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
        * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0e1621; }
        ::-webkit-scrollbar-thumb { background: #2b3847; border-radius: 4px; }
        .bg-telegram-main { background-color: #0e1621; }
        .bg-telegram-sidebar { background-color: #17212b; }
        .bg-telegram-header { background-color: #17212b; }
        .chat-pattern { background-color: #0e1621; background-image: radial-gradient(#1f2c34 0.75px, transparent 0.75px); background-size: 16px 16px; }
    </style>
</head>
<body class="bg-telegram-main text-gray-100 h-[100dvh] overflow-hidden flex flex-col">

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 bg-[#0e1621] z-50 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="relative mb-6 animate-pulse">
            <div class="w-24 h-24 bg-black/60 border border-yellow-500/40 rounded-3xl flex items-center justify-center text-yellow-500 text-5xl shadow-2xl">
                <i class="fa-solid fa-bat"></i>
            </div>
        </div>
        <div class="w-40 h-1 bg-gray-800 rounded-full overflow-hidden">
            <div id="loading-bar" class="h-full bg-yellow-500 transition-all duration-500 w-0"></div>
        </div>
        <span class="text-gray-400 text-[11px] mt-3 tracking-widest font-medium">GAP BATMAN SECURE</span>
    </div>

    <!-- Professional Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/85 z-40 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#17212b] border border-[#2b3847] p-7 rounded-3xl w-full max-w-sm shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-20 h-20 bg-black border-2 border-yellow-500/50 rounded-2xl flex items-center justify-center mx-auto mb-4 text-yellow-500 text-3xl shadow-lg">
                    <i class="fa-solid fa-bat"></i>
                </div>
                <h2 class="text-xl font-bold text-white tracking-wide">ورود به گپ بتمنی</h2>
                <p class="text-xs text-gray-400 mt-1">نام مستعار یا رمز مدیریت را وارد کنید</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400 block mb-1.5">نام نمایشی</label>
                    <input type="text" id="username-input" placeholder="مثلا: علی..." class="w-full bg-[#212f3d] border border-[#2b3847] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-yellow-500 transition">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1.5">رمز ورود مالک (اختیاری)</label>
                    <input type="password" id="owner-pass-input" placeholder="رمز عبور..." class="w-full bg-[#212f3d] border border-[#2b3847] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-yellow-500 transition">
                </div>
                <button onclick="handleLogin()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3 rounded-xl transition shadow-lg text-sm mt-2">
                    ورود به پیام‌رسان
                </button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="flex flex-1 overflow-hidden hidden relative">
        
        <!-- Sidebar Navigation (Telegram Style - Desktop) -->
        <div class="hidden md:flex w-16 bg-telegram-sidebar border-l border-[#2b3847] flex-col items-center py-3 justify-between z-20">
            <div class="flex flex-col space-y-4">
                <div class="w-10 h-10 rounded-2xl bg-black border border-yellow-500/50 flex items-center justify-center text-yellow-500 shadow-md">
                    <i class="fa-solid fa-bat"></i>
                </div>
                <div class="w-10 h-10 rounded-xl bg-[#2b3847] flex items-center justify-center text-yellow-400 cursor-pointer shadow">
                    <i class="fa-solid fa-comments text-lg"></i>
                </div>
            </div>
            <div class="flex flex-col space-y-3">
                <div onclick="openOwnerBadgeSettings()" id="owner-settings-btn" class="w-10 h-10 rounded-xl hover:bg-[#2b3847] flex items-center justify-center text-yellow-500 cursor-pointer transition hidden" title="تنظیم عکس کوچک مالک">
                    <i class="fa-solid fa-image text-sm"></i>
                </div>
            </div>
        </div>

        <!-- Chat List Panel -->
        <div class="hidden md:flex w-80 bg-telegram-sidebar border-l border-[#2b3847] flex-col z-10">
            <div class="p-3 border-b border-[#2b3847] flex items-center justify-between">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div id="user-avatar" class="w-10 h-10 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-sm shadow">U</div>
                    <div class="min-w-0">
                        <div id="sidebar-username" class="text-sm font-bold text-white truncate">کاربر</div>
                        <div class="text-[11px] text-green-400">آنلاین</div>
                    </div>
                </div>
            </div>
            <div class="p-2">
                <div class="bg-[#212f3d] rounded-xl px-3 py-2 flex items-center">
                    <i class="fa-solid fa-search text-gray-400 text-xs ml-2"></i>
                    <input type="text" placeholder="جستجو..." class="bg-transparent text-xs text-white focus:outline-none w-full">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto mt-1">
                <div class="flex items-center px-3 py-3 bg-[#2b3847]/70 cursor-pointer border-r-4 border-yellow-500">
                    <div class="w-12 h-12 rounded-2xl bg-black border border-yellow-500/40 flex items-center justify-center text-yellow-500 text-lg shrink-0 ml-3">
                        <i class="fa-solid fa-bat"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="text-sm font-bold text-white truncate">گپ بتمنی</span>
                            <span class="text-[10px] text-gray-400">هم اکنون</span>
                        </div>
                        <p class="text-xs text-gray-400 truncate">گپ عمومی رسمی بتمن</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col bg-telegram-main chat-pattern w-full h-full">
            <!-- Header -->
            <div class="h-14 bg-telegram-header px-4 flex items-center justify-between border-b border-[#2b3847] z-10 shrink-0">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-10 h-10 rounded-2xl bg-black border border-yellow-500/40 flex items-center justify-center text-yellow-500 text-base shadow">
                        <i class="fa-solid fa-bat"></i>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-white flex items-center gap-1.5">
                            گپ بتمنی
                        </div>
                        <div class="text-[11px] text-gray-400">گپ رسمی همگانی</div>
                    </div>
                </div>
                <div class="flex items-center space-x-3 space-x-reverse text-gray-300 md:hidden">
                    <button onclick="openOwnerBadgeSettings()" id="mobile-owner-btn" class="hidden text-yellow-500 p-1.5"><i class="fa-solid fa-image text-sm"></i></button>
                </div>
            </div>

            <!-- Messages List -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-3 md:p-4 space-y-3">
                <div class="flex justify-center my-2">
                    <div class="bg-[#17212b] text-gray-300 text-[11px] px-3.5 py-1.5 rounded-xl shadow border border-[#2b3847]">
                        به گپ بتمنی خوش آمدید! گفتگو آزاد است.
                    </div>
                </div>
            </div>

            <!-- Input Footer (Fully Mobile Friendly) -->
            <div class="p-2 md:p-3 bg-telegram-header border-t border-[#2b3847] flex items-center gap-2 shrink-0">
                <input type="text" id="message-input" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter') sendMessage()" class="flex-1 bg-[#212f3d] text-white text-sm rounded-xl px-4 py-3 focus:outline-none border border-transparent focus:border-yellow-500 transition">
                <button onclick="sendMessage()" class="bg-yellow-500 hover:bg-yellow-400 text-black w-11 h-11 rounded-xl flex items-center justify-center transition shadow-md shrink-0">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden file input for Owner Custom Badge Photo -->
    <input type="file" id="owner-badge-file" accept="image/*" class="hidden" onchange="handleOwnerBadgeUpload(event)">

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = { name: '', isOwner: false, ownerBadgeImg: '' };

        window.addEventListener('load', () => {
            const bar = document.getElementById('loading-bar');
            bar.style.width = '100%';
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    checkLogin();
                }, 700);
            }, 800);
        });

        function checkLogin() {
            const savedName = localStorage.getItem('batman_chat_name');
            const savedOwner = localStorage.getItem('batman_chat_isOwner') === 'true';
            const savedBadge = localStorage.getItem('batman_chat_badge') || '';

            if (savedName) {
                currentUser.name = savedName;
                currentUser.isOwner = savedOwner;
                currentUser.ownerBadgeImg = savedBadge;
                initApp();
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
            }
        }

        function handleLogin() {
            const nameInput = document.getElementById('username-input').value.trim();
            const passInput = document.getElementById('owner-pass-input').value.trim();

            let isOwner = false;
            let finalName = nameInput || 'کاربر مهمان';

            if (passInput === 'batman1792') {
                isOwner = true;
                finalName = 'batman';
            } else if (!nameInput) {
                alert('لطفا نام خود را وارد کنید.');
                return;
            }

            currentUser.name = finalName;
            currentUser.isOwner = isOwner;

            localStorage.setItem('batman_chat_name', finalName);
            localStorage.setItem('batman_chat_isOwner', isOwner);

            document.getElementById('login-modal').classList.add('hidden');
            initApp();
        }

        function initApp() {
            document.getElementById('app-container').classList.remove('hidden');
            updateUserHeaderInfo();

            if (currentUser.isOwner) {
                document.getElementById('owner-settings-btn').classList.remove('hidden');
                document.getElementById('mobile-owner-btn').classList.remove('hidden');
            }
        }

        function updateUserHeaderInfo() {
            const badgeHtml = currentUser.ownerBadgeImg ? `<img src="${currentUser.ownerBadgeImg}" class="w-4 h-4 rounded-full object-cover inline-block align-middle ml-0.5 border border-yellow-500">` : '';
            document.getElementById('sidebar-username').innerHTML = `${escapeHtml(currentUser.name)} ${badgeHtml}`;
            document.getElementById('user-avatar').innerText = currentUser.name.charAt(0).toUpperCase();
        }

        function openOwnerBadgeSettings() {
            if (!currentUser.isOwner) {
                alert('این قابلیت فقط مخصوص مالک است.');
                return;
            }
            document.getElementById('owner-badge-file').click();
        }

        function handleOwnerBadgeUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentUser.ownerBadgeImg = e.target.result;
                localStorage.setItem('batman_chat_badge', e.target.result);
                updateUserHeaderInfo();
                alert('عکس کوچک مالک با موفقیت تنظیم شد!');
            };
            reader.readAsDataURL(file);
        }

        socket.on('init_data', (data) => {
            const container = document.getElementById('chat-messages');
            while (container.children.length > 1) {
                container.removeChild(container.lastChild);
            }
            data.messages.forEach(msg => appendMessage(msg));
        });

        socket.on('new_message', (msg) => {
            appendMessage(msg);
        });

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            socket.emit('send_message', {
                name: currentUser.name,
                isOwner: currentUser.isOwner,
                ownerBadgeImg: currentUser.isOwner ? currentUser.ownerBadgeImg : '',
                text: text
            });

            input.value = '';
        }

        function appendMessage(msg) {
            const container = document.getElementById('chat-messages');
            const isMe = msg.name === currentUser.name;
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2`;

            const badgeHtml = (msg.isOwner && msg.ownerBadgeImg) ? `<img src="${msg.ownerBadgeImg}" class="w-3.5 h-3.5 rounded-full object-cover inline-block align-middle ml-0.5 border border-yellow-500">` : '';

            div.innerHTML = `
                <div class="max-w-[82%] md:max-w-[60%] rounded-2xl px-3.5 py-2 shadow-md ${isMe ? 'bg-[#2b5278] rounded-tr-none' : 'bg-[#182533] rounded-tl-none'}">
                    <div class="text-[11px] font-bold mb-1 flex items-center gap-1 ${msg.isOwner ? 'text-yellow-400' : 'text-blue-400'}">
                        ${escapeHtml(msg.name)}
                        ${badgeHtml}
                    </div>
                    <p class="text-sm text-white break-words">${escapeHtml(msg.text)}</p>
                    <div class="text-[9px] text-gray-400 text-left mt-1">${msg.time}</div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
